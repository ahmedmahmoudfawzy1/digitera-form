<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Submitted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: "#eef2fb", 100: "#d9e1f6", 200: "#b3c3ec", 300: "#8da5e3",
                            400: "#4f6fc9", 500: "#2243a4", 600: "#1d3a8f", 700: "#182f75",
                            800: "#13245c", 900: "#0e1a42",
                        },
                        accent: { 400: "#f4d03f", 500: "#f1c40f", 600: "#d4ac0d" },
                    },
                    fontFamily: { sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'] },
                },
            },
        };
    </script>
    <style>
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .pop { animation: popIn 0.25s ease-out; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-600 via-brand-500 to-brand-800 font-sans antialiased">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="pop w-full max-w-md rounded-2xl border-t-[6px] border-accent-500 bg-white p-8 text-center shadow-[0_20px_45px_rgba(14,26,66,0.35)]">
            <img src="assets/eraasoft.png" alt="EraaSoft" class="mx-auto mb-6 h-11 w-auto object-contain sm:h-14">
            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-4xl text-green-600">✓</div>
            <h1 class="text-2xl font-bold text-brand-500">Registration Submitted</h1>
            <p class="mt-3 text-[15px] leading-relaxed text-slate-600">
                Thank you! Your registration has been received successfully.
                Our team will get back to you soon.
            </p>
            <a href="index.html"
               class="mt-6 inline-block rounded-xl bg-brand-500 px-6 py-2.5 font-bold text-white transition hover:bg-brand-600">
                Submit another response
            </a>
        </div>
    </div>
</body>
</html>
